[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openreview"
version = "0.1.0"
description = "Local-first AI code review platform"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Open Review Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "GitPython>=3.1.43",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "cryptography>=44.0.0",
    "platformdirs>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[project.scripts]
openreview = "openreview.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/openreview"]

[tool.hatch.build.targets.wheel.sources]
"src/openreview" = "openreview"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py313"]
